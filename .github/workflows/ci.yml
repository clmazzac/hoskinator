name: CI

on:
  pull_request:
  push:
    branches: [main]

# A stack of PRs pushes often; only the newest run per branch is worth finishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to commit SHAs rather than tags: a tag can be
      # repointed at different code, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the stable channel, matching rust-toolchain.toml. This action does not
      # read that file, so the two agree by both naming `stable` and never a version.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable @ 2026-07-16
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Format
        run: cargo fmt --all --check

      # --all-features so the future `ai` crate is checked too. Per ADR-0005 it must build
      # and test without an API key present, via the stubbed transport seam.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features
