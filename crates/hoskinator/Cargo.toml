[package]
name = "hoskinator"
description = "Git-native resume manager: HTTP daemon, CLI, and Web UI host in a single binary."
version.workspace = true
edition.workspace = true
repository.workspace = true

[features]
# Built in with a key present, or absent entirely; no separate AI process (ADR-0005).
ai = ["dep:hoskinator-ai"]

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
hoskinator-ai = { workspace = true, optional = true }
hoskinator-core = { workspace = true }
jsonrpsee = { version = "0.26", features = ["http-client", "macros", "server"] }
mime_guess = "2"
rust-embed = { version = "8", features = ["debug-embed"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }

[dev-dependencies]
git2 = { version = "0.20", features = ["vendored-libgit2"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
