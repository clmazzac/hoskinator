[package]
name = "hoskinator"
description = "Git-native resume manager: HTTP daemon, CLI, and Web UI host in a single binary."
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
hoskinator-core = { workspace = true }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
