[package]
name = "hoskinator-core"
description = "Hoskinator's core engine: the Master Store, git mediation, and the core JSON-RPC methods."
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
directories = "6.0.0"
git2 = { version = "0.20", features = ["vendored-libgit2"] }
libsql = { version = "0.9.30", default-features = false, features = ["core"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
toml = "1.1.4"

[dev-dependencies]
jsonschema = { version = "0.49", default-features = false }
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
