[package]
name = "hoskinator-core"
description = "Hoskinator's core engine: the Master Store, git mediation, and the core JSON-RPC methods."
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22.1"
diesel = { version = "2.3.11", features = [
    "sqlite",
    "returning_clauses_for_sqlite_3_35",
] }
directories = "6.0.0"
git2 = { version = "0.20", features = ["vendored-libgit2"] }
indexmap = "2.14.0"
jsonschema = { version = "0.49", default-features = false }
libsql = { version = "0.10.0-pre.4", default-features = false, features = [
    "remote",
    "tls",
] }
libsqlite3-sys = { version = "0.37.0", features = ["bundled"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1", features = ["rt"] }
toml = "1.1.4"
url = "2.5.8"
yaml_serde = "0.10.7"
yamlpatch = "1.30.0-rc1"
yamlpath = "1.30.0-rc1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
