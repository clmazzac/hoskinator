[package]
name = "hoskinator-core"
description = "Hoskinator's core engine: the Master Store, git mediation, and the core JSON-RPC methods."
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
diesel = { version = "2.3.11", features = [
    "sqlite",
    "returning_clauses_for_sqlite_3_35",
] }
directories = "6.0.0"
git2 = { version = "0.20", features = ["vendored-libgit2"] }
indexmap = "2.14.0"
jsonschema = { version = "0.49", default-features = false }
libsqlite3-sys = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1", features = ["rt"] }
toml = "1.1.4"
yaml_serde = "0.10.7"
yamlpatch = "1.30.0-rc1"
yamlpath = "1.30.0-rc1"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
